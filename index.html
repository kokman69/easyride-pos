<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Easyride სალარო</title>
<meta name="theme-color" content="#17181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Easyride">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=56">
<script>try{var md=localStorage.getItem('er-mode');if(md==='simple'||(md!=='full'&&(matchMedia('(pointer:coarse)').matches||innerWidth<=1100)))document.documentElement.classList.add('simple')}catch(e){}</script>
<script>try{var th=localStorage.getItem('er-theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th)}catch(e){}</script>
</head>
<body>

<!-- LOGIN -->
<div id="gate" class="gate">
  <div class="panel pad stack">
    <div class="row between">
      <div class="brand">easy<b>ride</b><small data-i="app_sub"></small></div>
      <label class="btn icon-btn langbtn" title="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select class="lang" id="lang-g" aria-label="Language"></select></label>
    </div>
    <div id="gate-body" class="stack"><div class="muted" data-i="loading"></div></div>
  </div>
</div>

<!-- AFTER LOGIN: open the cash register (sends yesterday's report) -->
<div id="opengate" class="opengate" hidden>
  <div class="og-box">
    <div class="brand">easy<b>ride</b></div>
    <h1 id="og-hi"></h1>
    <p class="muted" data-i="og_hint"></p>
    <button type="button" class="btn primary og-btn" id="og-open" data-i="og_open"></button>
    <button type="button" class="btn ghost small" id="og-skip" data-i="og_later" hidden></button>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="bar">
    <div class="brand">easy<b>ride</b><small data-i="app_sub"></small></div>
    <nav id="tabs" role="tablist"></nav>
    <div class="who">
      <button type="button" class="whobtn" id="who-btn"><span id="who-name"></span><span id="who-role" class="role"></span></button>
      <button class="btn icon-btn mode-btn" type="button" id="mode-btn"></button>
      <button class="btn icon-btn theme-btn" type="button" data-i-title="theme_toggle"></button>
      <label class="btn icon-btn langbtn" title="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select class="lang" id="lang-a" aria-label="Language"></select></label>
      <button class="btn small" id="logout" data-i="logout"></button>
    </div>
  </div>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <!-- HOME: sale or rental on the left, today on the right -->
  <section id="v-home" hidden>
    <div class="hnav htop">
      <button type="button" class="btn hcashbtn" data-go="cash">💵 <span data-i="tab_cash"></span></button>
      <button type="button" class="btn" data-go="stock" data-i="tab_stock"></button>
      <button type="button" class="btn" data-go="customers" data-i="tab_customers"></button>
      <button type="button" class="btn" data-go="report" data-i="tab_report"></button>
      <button type="button" class="btn" data-go="settings" data-i="tab_settings" id="h-go-settings"></button>
    </div>
    <div class="hmode" id="h-mode" role="tablist"></div>
    <div class="home2">
      <div class="stack" id="h-sale">
        <div id="h-sale-pick" class="stack"></div>
        <div id="h-sale-cart"></div>
      </div>
      <div id="h-rent"></div>
    </div>
  </section>

  <!-- CASH DESK: today's sales and rentals, vehicles out now, closing the day -->
  <section id="v-cash" hidden>
    <div class="row between" style="margin-bottom:12px"><h2 style="margin:0">💵 <span data-i="tab_cash"></span></h2><button type="button" class="btn" data-go="home" data-i="tab_home"></button></div>
    <div class="cashgrid">
      <div class="panel pad stack"><div class="hhead"><h3 data-i="tab_rent"></h3><span class="num" id="h-rent-sum"></span></div><div id="h-rented" class="hcards"></div></div>
      <div class="panel pad stack"><div class="hhead"><h3 data-i="h_sold_today"></h3><span class="num" id="h-sold-sum"></span></div><div id="h-sold" class="hlist"></div></div>
      <div class="stack"><h3 style="margin:0" data-i="h_close_day"></h3><div id="h-cash" class="hcash"></div></div>
    </div>
  </section>

  <!-- SALE -->
  <section id="v-sale" hidden>
    <div class="daybar" id="day-banner" hidden></div>
    <div class="pos">
      <div class="stack">
        <div class="chips seg" id="s-kind"></div>
        <div class="row">
          <input id="s-q" type="search" data-iph="search_items" style="flex:1;min-width:160px" autocomplete="off">
          <button class="btn primary" id="s-add-easy" data-i="easy_add" hidden></button>
          <button class="btn" id="s-custom" data-i="custom_item"></button>
        </div>
        <div class="chips" id="s-types"></div>
        <div class="panel pad stack spick" id="s-pick">
          <button type="button" class="btn" id="sp-photos"></button>
          <div class="formgrid two" id="sp-veh">
            <label class="f"><span data-i="sp_type"></span><select id="sp-type"></select></label>
            <label class="f"><span data-i="sp_model"></span><select id="sp-model"></select></label>
          </div>
          <div class="egrid" id="sp-vgrid"></div>
          <div class="stack" id="sp-easy" style="gap:8px">
            <label class="f"><span data-i="sp_code"></span><input id="sp-code" type="search" inputmode="numeric" autocomplete="off" data-iph="sp_code_ph"></label>
            <div id="sp-hit"></div>
            <label class="f"><span data-i="sp_item"></span><select id="sp-item"></select></label>
            <div class="egrid" id="sp-egrid"></div>
          </div>
          <div class="small muted" data-i="sp_hint"></div>
        </div>
        <div id="s-list" class="plist"></div>
      </div>
      <aside class="panel pad receipt stack" id="receipt">
        <div class="sheet-head row between"><h2 data-i="cart"></h2><button class="btn" id="c-close" data-i="close"></button></div>
        <div class="row between"><h3 data-i="new_sale"></h3><button class="btn ghost small" id="c-clear" data-i="clear"></button></div>
        <div id="c-lines"></div>
        <div class="formgrid two">
          <label class="f"><span data-i="payment"></span><select id="c-pay"></select></label>
          <label class="f"><span data-i="seller"></span><select id="c-seller"></select></label>
          <label class="f" style="grid-column:1/-1"><span data-i="disc_field"></span><input id="c-disc" type="text" inputmode="decimal" autocomplete="off" placeholder="0 / 10%"></label>
        </div>
        <div class="stack" id="c-cust-wrap" hidden>
          <div class="small" style="font-weight:600"><span data-i="customer"></span> <span class="req" data-i="required_mark"></span></div>
          <div id="c-cust"></div>
        </div>
        <details class="more"><summary data-i="more_fields"></summary><div class="stack">
          <label class="f"><span data-i="note"></span><input id="c-note" type="text" data-iph="note_ph"></label>
        </div></details>
        <div class="tot"><span class="muted" id="c-sub"></span><span class="num" id="c-total">0 ₾</span></div>
        <button class="btn primary big" id="c-save" disabled data-i="confirm_sale"></button>
      </aside>
    </div>
    <button class="cartbar" id="cartbar" hidden><span id="cb-count"></span><span><span class="num" id="cb-total"></span> · <span data-i="open_cart"></span></span></button>
  </section>

  <!-- STOCK -->
  <section id="v-stock" hidden>
    <div class="stack">
      <div class="row between"><h2 data-i="tab_stock"></h2><div class="row" style="gap:8px"><button class="btn primary" id="p-add" data-i="add_item"></button><button class="btn primary" id="p-add-veh" data-i="add_vehicle"></button></div></div>
      <div class="stats" id="p-stats"></div>
      <div class="chips seg" id="p-kind"></div>
      <div class="row">
        <input id="p-q" type="search" data-iph="search_stock" style="flex:1;min-width:160px" autocomplete="off" name="p-q-nofill">
        <label class="row small muted" style="flex-wrap:nowrap"><input type="checkbox" id="p-instock"> <span data-i="only_in_stock"></span></label>
      </div>
      <div class="chips" id="p-types"></div>
      <div class="panel items" id="p-list"></div>
    </div>
  </section>

  <!-- RENT -->
  <section id="v-rent" hidden>
    <div class="grid2" id="r-grid">
      <div class="panel pad stack" id="r-form">
        <h3 data-i="rent_new"></h3>
        <div class="formgrid two">
          <label class="f"><span data-i="vehicle"></span><select id="r-type"></select></label>
          <label class="f"><span data-i="tariff"></span><select id="r-rate"></select></label>
        </div>
        <div class="f"><span data-i="unit"></span><input id="r-unit-q" type="search" autocomplete="off" data-iph="unit_search_ph" style="margin-bottom:6px"><div class="unitrow"><select id="r-unit" aria-label="unit"></select><button type="button" class="btn ghost addunit" id="r-unit-add" data-i-title="add_unit">+</button></div><div id="r-units-x" class="stack" style="gap:6px;margin-top:6px"></div><div id="r-units-note" class="small muted" hidden></div></div>
        <div id="r-unit-hint" class="small muted" hidden></div>
        <div class="formgrid two">
          <div class="f"><span data-i="price"></span><input id="r-price" type="number" min="0" inputmode="decimal" aria-label="price">
            <select id="r-pay" class="pillsel" aria-label="payment"></select></div>
          <div class="f"><span data-i="deposit"></span><div class="depwrap"><input id="r-dep" type="number" min="0" value="0" inputmode="decimal" aria-label="deposit">
            <select id="r-dep-cur" class="pillsel cur" aria-label="currency"><option value="GEL">₾</option><option value="USD">$</option><option value="EUR">€</option></select></div>
            <select id="r-dep-pay" class="pillsel" aria-label="deposit payment"></select></div>
          <label class="f"><span data-i="disc_field"></span><input id="r-disc" type="text" inputmode="decimal" autocomplete="off" placeholder="0 / 10%"></label>
          <div class="f"><span data-i="to_pay"></span><b class="num" id="r-final" style="font-size:20px;padding:8px 0"></b></div>
        </div>
        <details class="more"><summary data-i="more_fields"></summary>
          <div class="formgrid two">
            <label class="f"><span data-i="seller"></span><select id="r-seller"></select></label>
            <label class="f"><span data-i="return_by"></span><input id="r-end" type="datetime-local"></label>
          </div></details>
        <div class="small" style="font-weight:600"><span data-i="customer"></span> <span class="req" data-i="required_mark"></span></div>
        <div id="r-cust"></div>
        <div class="small" style="font-weight:600"><span data-i="veh_video"></span> <span class="muted" data-i="optional"></span></div>
        <div id="r-video" class="vidbox stack"></div>
        <button class="btn primary big" id="r-save" data-i="start_rent"></button>
      </div>
      <div class="panel pad stack">
        <h3 data-i="rent_active"></h3>
        <div id="r-active"></div>
      </div>
    </div>
    <div class="panel tw" style="margin-top:16px" id="r-history"></div>
  </section>

  <!-- CUSTOMERS -->
  <section id="v-customers" hidden>
    <div class="stack">
      <div class="row between"><h2 data-i="tab_customers"></h2><button class="btn primary" id="k-add" data-i="cust_new"></button></div>
      <input id="k-q" type="search" data-iph="cust_search_ph">
      <div class="kglass" id="k-list"></div>
    </div>
  </section>

  <!-- REPORT -->
  <section id="v-report" hidden>
    <div class="stack">
      <h2 data-i="tab_report"></h2>
      <div class="chips" id="rp-period"></div>
      <div class="row" style="flex-wrap:nowrap"><input type="date" id="rp-from"><span class="muted">—</span><input type="date" id="rp-to"></div>
      <div class="stats" id="rp-stats"></div>
      <div class="grid2">
        <div class="panel"><div class="pad"><h3 data-i="by_seller"></h3></div><div class="tw" id="rp-sellers"></div></div>
        <div class="panel"><div class="pad"><h3 data-i="by_type"></h3></div><div class="tw" id="rp-types"></div></div>
      </div>
      <div class="panel"><div class="pad row between"><h3 data-i="veh_sold_all"></h3><span class="small muted num" id="rp-vall-n"></span></div><div id="rp-vall"></div></div>
      <div class="panel"><div class="pad"><h3 data-i="sales_log"></h3></div><div class="tw" id="rp-sales"></div></div>
    </div>
  </section>

  <!-- FINANCE -->
  <section id="v-fin" hidden>
    <div class="stack">
      <div class="row between"><h2 data-i="tab_fin" style="margin:0"></h2><button type="button" class="btn small" id="fn-refresh" data-i="refresh"></button></div>
      <div class="row" style="flex-wrap:nowrap"><input type="date" id="fn-from"><span class="muted">—</span><input type="date" id="fn-to"></div>
      <div class="stack" id="fn-body"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="v-settings" hidden>
    <div class="grid2">
      <div class="panel pad stack">
        <h3 data-i="fleet_title"></h3>
        <p class="small muted" style="margin:0" data-i="fleet_hint"></p>
        <div id="st-fleet"></div>
        <div class="formgrid two">
          <label class="f"><span data-i="f_type"></span><select id="fl-type"></select></label>
          <label class="f"><span data-i="f_name"></span><input id="fl-model" data-iph="fleet_model_ph"></label>
          <label class="f"><span data-i="f_color"></span><input id="fl-color"></label>
          <label class="f"><span data-i="fleet_num"></span><input id="fl-num" data-iph="fleet_num_ph"></label>
        </div>
        <button class="btn" id="fl-add" data-i="fleet_add"></button>
      </div>
      <div class="stack">
        <div class="panel pad stack">
          <h3 data-i="sellers"></h3>
          <div id="st-sellers"></div>
          <div class="row" style="flex-wrap:nowrap"><input id="st-new" type="text" data-iph="name_ph"><button class="btn" id="st-add" data-i="add"></button></div>
        </div>
        <div class="panel pad stack">
          <div class="row between"><h3 data-i="staff_title"></h3><button class="btn ghost small" id="st-log" data-i="all_activity"></button></div>
          <p class="small muted" style="margin:0" data-i="staff_hint"></p>
          <div id="st-staff" class="stack" style="gap:6px"></div>
          <div id="st-noacc"></div>
          <div class="formgrid two">
            <label class="f"><span data-i="cust_name"></span><input id="sf-name" type="text" autocomplete="off"></label>
            <label class="f"><span data-i="role"></span><select id="sf-role"><option value="consultant" data-i="role_cons"></option><option value="moderator" data-i="role_mod"></option><option value="admin" data-i="role_admin"></option></select></label>
            <label class="f" style="grid-column:1/-1"><span data-i="password"></span><input id="sf-pw" type="password" autocomplete="new-password" minlength="6"></label>
          </div>
          <button class="btn primary" id="sf-add" data-i="staff_add"></button>
        </div>
      </div>
      <div class="panel pad stack">
        <h3 data-i="tariffs_title"></h3>
        <div id="st-tariffs"></div>
        <button class="btn primary" id="st-save-t" data-i="save_tariffs"></button>
      </div>
    </div>
  </section>
</main>
</div>

<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=56"></script>
<script src="i18n.js?v=56"></script>
<script src="countries.js?v=56"></script>
<script src="mrz.js?v=56"></script>
<script src="contract.js?v=56"></script>
<script src="report.js?v=56"></script>
<script src="app.js?v=56"></script>
</body>
</html>
