# GitLab Pages: publishes this folder as a static site
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p .public
    - cp index.html manifest.webmanifest *.css *.js *.png *.svg .public/
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
